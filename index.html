<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presupuestador SATE</title>

<!-- MSAL.js para login con cuenta Microsoft 365 -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<!-- jsPDF + html2canvas para exportar el presupuesto a PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root{
    --capa-naranja:#F08900;
    --capa-purpura:#942E86;
    --capa-negro:#3E3938;
    --capa-rojo:#CE092C;
    --capa-rosa:#C74D92;
    --gris-claro:#F5F3F2;
    --gris-borde:#DDD8D6;
    --blanco:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    font-family: "Helvetica Neue", Arial, sans-serif;
    background:var(--gris-claro);
    color:var(--capa-negro);
    margin:0;
    padding:0;
  }
  header{
    background:var(--blanco);
    border-bottom:3px solid var(--capa-naranja);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  header h1{
    font-size:18px;
    margin:0;
    color:var(--capa-purpura);
    font-weight:700;
  }
  header .user-info{
    font-size:13px;
    color:#777;
    display:flex;
    align-items:center;
    gap:12px;
  }
  #app{
    max-width:900px;
    margin:24px auto;
    padding:0 16px 60px;
  }
  .card{
    background:var(--blanco);
    border:1px solid var(--gris-borde);
    border-radius:10px;
    padding:24px;
    margin-bottom:20px;
  }
  .tabs{
    display:flex;
    gap:4px;
    margin-bottom:20px;
  }
  .tab-btn{
    flex:1;
    padding:12px;
    border:none;
    background:var(--blanco);
    border:1px solid var(--gris-borde);
    cursor:pointer;
    font-weight:600;
    color:#999;
    border-radius:8px 8px 0 0;
  }
  .tab-btn.active{
    color:var(--capa-purpura);
    border-bottom:3px solid var(--capa-naranja);
    background:var(--gris-claro);
  }
  .tab-btn:disabled{
    cursor:not-allowed;
    opacity:.5;
  }
  .partida-title{
    color:var(--capa-purpura);
    font-size:15px;
    font-weight:700;
    margin:28px 0 12px;
    padding-bottom:6px;
    border-bottom:2px solid var(--capa-naranja);
  }
  .partida-title:first-child{margin-top:0;}
  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
    color:var(--capa-negro);
  }
  .field select, .field input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--gris-borde);
    border-radius:6px;
    font-size:14px;
    font-family:inherit;
    background:var(--blanco);
  }
  .field select:focus, .field input:focus{
    outline:none;
    border-color:var(--capa-naranja);
  }
  button.primary{
    background:var(--capa-naranja);
    color:var(--blanco);
    border:none;
    padding:12px 24px;
    border-radius:6px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  button.primary:hover{background:#d67b00;}
  button.secondary{
    background:var(--blanco);
    color:var(--capa-purpura);
    border:1px solid var(--capa-purpura);
    padding:12px 24px;
    border-radius:6px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  button.secondary:hover{background:var(--gris-claro);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .btn-row{display:flex;gap:12px;margin-top:20px;}
  table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:24px;
    font-size:13px;
  }
  table caption{
    text-align:left;
    font-weight:700;
    color:var(--capa-purpura);
    padding:10px 0 8px;
    font-size:14px;
    border-bottom:2px solid var(--capa-naranja);
  }
  th{
    background:var(--gris-claro);
    text-align:left;
    padding:8px 10px;
    font-weight:700;
    border-bottom:1px solid var(--gris-borde);
  }
  td{
    padding:7px 10px;
    border-bottom:1px solid #EEE8E6;
  }
  td.num, th.num{text-align:right;}
  td input[type=number], td input[type=text]{
    width:80px;
    padding:4px 6px;
    border:1px solid var(--gris-borde);
    border-radius:4px;
    text-align:right;
  }
  .pendiente{
    color:var(--capa-rojo);
    font-weight:600;
    font-size:11px;
  }
  .info-icon{
    display:inline-block;
    cursor:help;
    color:var(--capa-purpura);
    font-size:13px;
    margin-left:2px;
  }
  .total-row td{
    font-weight:700;
    border-top:2px solid var(--capa-negro);
    border-bottom:none;
  }
  .grand-total{
    text-align:right;
    font-size:20px;
    font-weight:700;
    color:var(--capa-purpura);
    margin-top:8px;
  }
  #loginScreen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:80vh;
    text-align:center;
  }
  .spinner{
    border:3px solid var(--gris-borde);
    border-top:3px solid var(--capa-naranja);
    border-radius:50%;
    width:32px;height:32px;
    animation:spin 1s linear infinite;
    margin:16px auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{
    background:#FDECEC;
    border:1px solid var(--capa-rojo);
    color:var(--capa-rojo);
    padding:12px 16px;
    border-radius:6px;
    font-size:13px;
    margin-bottom:16px;
  }
  .hint{
    font-size:12px;
    color:#888;
    margin-top:4px;
  }
  .toast{
    position:fixed;
    bottom:24px;
    right:24px;
    background:var(--capa-negro);
    color:#fff;
    padding:12px 18px;
    border-radius:6px;
    font-size:13px;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
    z-index:999;
  }
  @media (max-width: 480px){
    header{ padding:10px 12px; flex-wrap:wrap; gap:8px; }
    header h1{ font-size:15px; }
    #app{ padding:0 8px 40px; margin:12px auto; }
    .card{ padding:12px; }
    .tabs{ flex-wrap:wrap; }
    table{ font-size:11.5px; }
    th, td{ padding:6px 4px; }
    td input[type=number], td input[type=text]{
      width:100%;
      max-width:64px;
      padding:4px;
      font-size:11.5px;
    }
    td.num{ white-space:nowrap; }
    .grand-total{ font-size:16px; }
    .field select, .field input{ padding:8px 10px; font-size:13px; }
    #tabBudget .btn-row{
      flex-wrap:wrap;
      gap:8px;
    }
    #tabBudget .btn-row button{
      flex:1 1 calc(50% - 8px);
      padding:10px 6px;
      font-size:12px;
      white-space:normal;
    }
  }
</style>
</head>

// Explicación en lenguaje natural de cómo se calcula la cantidad de cada fila.
// Es DINÁMICA: cada función recibe las respuestas (a) y el texto real de la
// fórmula de la columna G leída en vivo (f) para esa fila, y extrae de ahí los
// divisores/multiplicadores — así que si cambias una fórmula en el Excel
// (p.ej. el "2.5" de un perfil), la explicación se actualiza sola. Los
// rendimientos de terminación/fondo también se leen en vivo (RENDIMIENTO_*).
// Solo el texto y la estructura de la frase están fijos aquí; los números
// siempre vienen del Excel.
function num(f, regex, fallback){
  const m = f && f.match(regex);
  return m ? m[1] : fallback;
}
const EXPLICACIONES = {
  4:  (a, f) => `Rendimiento ${a.D8}: ${fmt(RENDIMIENTO_TERMINACION[a.D8] || 0)} kg/m² (según terminación seleccionada) sobre ${fmt(Number(a.D5))} m² de fachada (sacos de ${num(f,/\/\s*([\d.]+)\s*,0\)/,"25")} kg).`,
  5:  (a, f) => `Rendimiento del fondo: ${fmt(RENDIMIENTO_FONDO)} kg/m² (aplicable solo si la terminación es Acrílico) sobre ${fmt(Number(a.D5))} m² de fachada (envases de ${num(f,/\/\s*([\d.]+)\s*,0\)/,"20")} kg).`,
  6:  (a, f) => `(${fmt(Number(a.D5))} m² de fachada × ${num(f,/D5\*([\d.]+)\//,"10")}) / ${num(f,/D5\*[\d.]+\/([\d.]+)/,"25")} kg por saco.`,
  7:  (a, f) => `(${fmt(Number(a.D5))} m² de fachada / ${num(f,/D5\/([\d.]+)\)/,"50")}) × ${num(f,/\)\*([\d.]+)/,"1.2")} (factor de tacos).`,
  8:  (a, f) => {
        const lm = num(f,/IF\(D4="LM",([\d.]+),/,"0.6");
        const otro = num(f,/IF\(D4="LM",[\d.]+,([\d.]+)\)/,"0.5");
        return `${fmt(Number(a.D5))} m² de fachada / ${a.D4 === "LM" ? lm : otro} m² por unidad de malla (según aislante "${a.D4}").`;
      },
  9:  (a, f) => `${fmt(Number(a.D5))} m² de fachada × ${num(f,/D5\*([\d.]+)/,"8")}.`,
  10: (a) => a.D4 === "LM"
        ? `Misma cantidad que las fijaciones mecánicas (mismo cálculo que esa fila), por tratarse de aislante Lana Mineral (LM).`
        : `No aplica con el aislante seleccionado ("${a.D4}"); solo se activa con Lana Mineral (LM).`,
  12: (a, f) => `${fmt(Number(a.D11))} m de perímetro de fachada / ${num(f,/\/\s*([\d.]+)\s*,0\)/,"2.5")} m por unidad.`,
  13: (a, f) => `${fmt(Number(a.D11))} m de perímetro de fachada / ${num(f,/\/\s*([\d.]+)\s*,0\)/,"2.5")} m por unidad.`,
  14: (a, f) => `${fmt(Number(a.D5))} m² de fachada / ${num(f,/D5\/([\d.]+)/,"60")} m² por unidad de montaje.`,
  16: (a, f) => `${fmt(Number(a.D14))} m de fachada con esquinas 90º / ${num(f,/D14\/([\d.]+)/,"2.5")} m por unidad.`,
  17: (a, f) => `${fmt(Number(a.D16))} m de fachada con cierres laterales / ${num(f,/D16\/([\d.]+)/,"2.5")} m por unidad.`,
  19: (a, f) => `(${fmt(Number(a.D19))} cm de ancho × ${a.D18} ventanas) / ${num(f,/D19\*D18\/([\d.]+)/,"250")}.`,
  20: (a, f) => `(${fmt(Number(a.D20))} cm de alto × ${a.D18} ventanas) / ${num(f,/D20\*D18\/([\d.]+)/,"250")}, x${num(f,/,0\)\*([\d.]+)/,"2")} (dos laterales).`,
  21: (a, f) => `(${fmt(Number(a.D19))} cm de ancho × ${a.D18} ventanas) / ${num(f,/D19\*D18\/([\d.]+)/,"250")}, x${num(f,/,0\)\*([\d.]+)/,"2")} (superior e inferior).`,
  22: (a, f) => `(${fmt(Number(a.D20))} cm de alto × ${a.D18} ventanas) / ${num(f,/D20\*D18\/([\d.]+)/,"250")}, x${num(f,/,0\)\*([\d.]+)/,"2")} (las esquinas).`,
  23: (a, f) => `(${fmt(Number(a.D19))} cm de ancho × ${a.D18} ventanas) / ${num(f,/D19\*D18\/([\d.]+)/,"250")} (alféizar).`,
  25: (a, f) => `(${fmt(Number(a.D25))} cm de ancho × ${a.D24} puertas) / ${num(f,/D25\*D24\/([\d.]+)/,"250")}.`,
  26: (a, f) => `(${fmt(Number(a.D27))} cm de alto × ${a.D24} puertas) / ${num(f,/D27\*D24\/([\d.]+)/,"250")}, x${num(f,/,0\)\*([\d.]+)/,"2")} (dos laterales).`,
  27: (a, f) => `(${fmt(Number(a.D25))} cm de ancho × ${a.D24} puertas) / ${num(f,/D25\*D24\/([\d.]+)/,"250")}, x${num(f,/,0\)\*([\d.]+)/,"2")} (superior e inferior).`,
  28: (a, f) => `(${fmt(Number(a.D27))} cm de alto × ${a.D24} puertas) / ${num(f,/D27\*D24\/([\d.]+)/,"250")}, x${num(f,/,0\)\*([\d.]+)/,"2")} (las esquinas).`
};

let siteId, masterDriveId, masterDriveItemId, docsLibraryId;
let dropdownOptions = {}; // rango -> [valores]
let TARIFA_CATALOG = []; // {codigo, descripcion, precio} — para el buscador de artículos manuales
let RENDIMIENTO_TERMINACION = {}; // { "Acrilico": 2, "Xilosano": 2, ... } kg/m² — leído en vivo del Excel

/* =========================================================================
   AUTENTICACIÓN (MSAL.js — PKCE, sin backend)
   ========================================================================= */
function initMsal(){
  msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: CONFIG.clientId,
      authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
      redirectUri: CONFIG.redirectUri
    },
    cache: { cacheLocation: "sessionStorage" }
  });
}

async function login(){
  try{
    await msalInstance.loginRedirect({ scopes: CONFIG.scopes });
    // La página se recarga tras el login; el flujo continúa en handleRedirectPromise (abajo)
  }catch(err){
    showLoginError(err);
  }
}

async function getToken(){
  const req = { scopes: CONFIG.scopes, account };
  try{
    const res = await msalInstance.acquireTokenSilent(req);
    return res.accessToken;
  }catch(err){
    await msalInstance.acquireTokenRedirect(req);
    // La página se recarga; no hay valor que devolver en esta ejecución
  }
}

function showLoginError(err){
  document.getElementById("loginBox").innerHTML = `
    <div class="error-box">No se ha podido iniciar sesión.<br>${err.message || err}</div>
    <button class="primary" id="loginBtn">Reintentar</button>`;
  document.getElementById("loginBtn").onclick = login;
}

async function afterLogin(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainApp").style.display = "block";
  document.getElementById("userInfo").innerHTML =
    `${account.name || account.username} · <a href="#" onclick="logout();return false;">Cerrar sesión</a>`;

  graphToken = await getToken();
  await loadMasterData();
}

function logout(){
  msalInstance.logoutRedirect();
}

/* =========================================================================
   LLAMADAS A MICROSOFT GRAPH
   ========================================================================= */
async function graphFetch(url, options = {}){
  const token = graphToken || await getToken();
  const res = await fetch(url, {
    ...options,
    headers: {
      "Authorization": `Bearer ${token}`,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  if(!res.ok){
    const body = await res.text();
    throw new Error(`Graph error ${res.status}: ${body}`);
  }
  return res.status === 204 ? null : res.json();
}

async function resolveSiteAndFiles(){
  // Sitio SharePoint
  const site = await graphFetch(
    `https://graph.microsoft.com/v1.0/sites/${CONFIG.sharepointHost}:${CONFIG.sitePath}`
  );
  siteId = site.id;

  // Cada biblioteca de documentos es un "drive" independiente del sitio,
  // no una carpeta dentro del drive por defecto — hay que listarlos y
  // encontrar el que corresponde por nombre.
  const drives = await graphFetch(`https://graph.microsoft.com/v1.0/sites/${siteId}/drives`);

  const masterDrive = drives.value.find(d => d.name === CONFIG.masterLibrary);
  if(!masterDrive){
    throw new Error(`No se encontró la biblioteca "${CONFIG.masterLibrary}". Bibliotecas disponibles: ${drives.value.map(d=>d.name).join(", ")}`);
  }
  masterDriveId = masterDrive.id;

  // Excel maestro dentro de esa biblioteca
  const masterItem = await graphFetch(
    `https://graph.microsoft.com/v1.0/drives/${masterDriveId}/root:/${encodeURI(CONFIG.masterFileName)}`
  );
  masterDriveItemId = masterItem.id;

  // Biblioteca de documentos (para guardar el presupuesto)
  const docsDrive = drives.value.find(d => d.name === CONFIG.docsLibrary);
  if(!docsDrive){
    throw new Error(`No se encontró la biblioteca "${CONFIG.docsLibrary}". Bibliotecas disponibles: ${drives.value.map(d=>d.name).join(", ")}`);
  }
  docsLibraryId = docsDrive.id;
}

// Crea una sesión de Excel NO persistente: los cálculos se hacen sobre una
// copia en memoria del libro, sin tocar ni guardar el Excel maestro real.
async function createWorkbookSession(){
  const res = await graphFetch(
    `https://graph.microsoft.com/v1.0/drives/${masterDriveId}/items/${masterDriveItemId}/workbook/createSession`,
    { method: "POST", body: JSON.stringify({ persistChanges: false }) }
  );
  return res.id;
}

async function closeWorkbookSession(sessionId){
  try{
    await graphFetch(
      `https://graph.microsoft.com/v1.0/drives/${masterDriveId}/items/${masterDriveItemId}/workbook/closeSession`,
      { method: "POST", headers: { "workbook-session-id": sessionId } }
    );
  }catch(e){ /* no crítico */ }
}

async function readRange(sheet, range, sessionId){
  const url = `https://graph.microsoft.com/v1.0/drives/${masterDriveId}/items/${masterDriveItemId}` +
    `/workbook/worksheets('${encodeURIComponent(sheet)}')/range(address='${range}')`;
  return graphFetch(url, { headers: sessionId ? { "workbook-session-id": sessionId } : {} });
}

async function writeRange(sheet, range, values, sessionId){
  const url = `https://graph.microsoft.com/v1.0/drives/${masterDriveId}/items/${masterDriveItemId}` +
    `/workbook/worksheets('${encodeURIComponent(sheet)}')/range(address='${range}')`;
  return graphFetch(url, {
    method: "PATCH",
    headers: { "workbook-session-id": sessionId },
    body: JSON.stringify({ values })
  });
}

/* =========================================================================
   CARGA INICIAL: sitio, excel maestro, opciones de los desplegables
   ========================================================================= */
async function loadMasterData(){
  const status = document.getElementById("formStatus");
  status.innerHTML = `<div class="spinner"></div><p>Cargando datos del Excel maestro…</p>`;
  try{
    await resolveSiteAndFiles();

    // Sesión no persistente solo para leer los rangos de opciones
    const sessionId = await createWorkbookSession();
    for(const q of QUESTIONS){
      if(q.type === "list" && !dropdownOptions[q.listRange]){
        const r = await readRange(CONFIG.masterSheetEntrada, q.listRange, sessionId);
        dropdownOptions[q.listRange] = r.values.map(row => row[0]).filter(v => v !== "" && v !== null);
      }
    }

    // Catálogo completo de la tarifa (Código/Descripción/Precio), para poder
    // buscar y añadir artículos manuales al presupuesto.
    const tarifaRange = await readRange(CONFIG.masterSheetTarifa, CONFIG.masterTarifaRange, sessionId);
    TARIFA_CATALOG = tarifaRange.values
      .filter(row => row[0] !== "" && row[0] !== null)
      .map(row => ({
        codigo: typeof row[0] === "number" ? String(row[0]).padStart(6, "0") : String(row[0]),
        descripcion: String(row[1] || "").replace(/\n/g, " ").trim(),
        tipo: String(row[3] || "").replace(/\n/g, " ").trim(),
        precio: Number(row[5]) || 0
      }));

    // Tablas de rendimiento (para las explicaciones dinámicas de cálculo)
    const rendTerm = await readRange(CONFIG.masterSheetEntrada, "K28:L32", sessionId);
    RENDIMIENTO_TERMINACION = {};
    rendTerm.values.forEach(row => { if(row[0]) RENDIMIENTO_TERMINACION[String(row[0])] = Number(row[1]) || 0; });
    const rendFondo = await readRange(CONFIG.masterSheetEntrada, "L33", sessionId);
    RENDIMIENTO_FONDO = Number(rendFondo.values[0][0]) || 0;

    await closeWorkbookSession(sessionId);

    status.innerHTML = "";
    renderForm();
  }catch(err){
    status.innerHTML = `<div class="error-box">No se ha podido cargar el Excel maestro.<br>${err.message}</div>`;
  }
}

/* =========================================================================
   CÁLCULO: escribe las respuestas en una sesión de Excel no persistente
   y lee de vuelta los resultados que el propio Excel calcula (E:I).
   Así se reutiliza EXACTAMENTE la misma lógica que ya está validada en el
   Excel maestro, sin tener que reimplementar cada fórmula en JavaScript.
   ========================================================================= */
async function calcularPresupuesto(){
  const budgetStatus = document.getElementById("budgetStatus");
  const budgetContent = document.getElementById("budgetContent");
  budgetContent.innerHTML = "";
  budgetStatus.innerHTML = `<div class="spinner"></div><p>Calculando presupuesto…</p>`;
  showTab("budget");
  document.getElementById("tabBudgetBtn").disabled = false;

  const answers = readFormValues();
  let sessionId;
  try{
    sessionId = await createWorkbookSession();

    // Escribimos cada respuesta en su celda D correspondiente (excepto las
    // preguntas "appOnly", que son propias de la app y no existen en el Excel)
    for(const q of QUESTIONS){
      if(q.appOnly) continue;
      await writeRange(CONFIG.masterSheetEntrada, q.cell, [[answers[q.cell]]], sessionId);
    }

    // Leemos de vuelta E:I para todas las filas de las 4 partidas
    const allRows = PARTIDAS.flatMap(p => p.rows);
    const minRow = Math.min(...allRows), maxRow = Math.max(...allRows);
    const range = `E${minRow}:I${maxRow}`;
    const result = await readRange(CONFIG.masterSheetEntrada, range, sessionId);

    lastBudget = buildBudget(result.values, result.formulas, minRow, Number(answers["descuentoGlobal"]) || 0, answers);
    aplicarArticulosManuales(lastBudget, Number(answers["descuentoGlobal"]) || 0);
    renderBudget(lastBudget);
    budgetStatus.innerHTML = "";
  }catch(err){
    budgetStatus.innerHTML = `<div class="error-box">No se ha podido calcular el presupuesto.<br>${err.message}</div>`;
  }finally{
    if(sessionId) await closeWorkbookSession(sessionId);
  }
}

// Construye la estructura de partidas -> líneas (agrupando por código dentro
// de cada partida) a partir de los valores E:I leídos del Excel.
function buildBudget(values, formulas, minRow, dtoDefault, answers){
  const partidasResult = PARTIDAS.map(p => ({ titulo: p.titulo, lineas: {}, total: 0 }));

  PARTIDAS.forEach((p, idx) => {
    p.rows.forEach(row => {
      const i = row - minRow;
      const [cod, desc, cant, precio, importe] = values[i] || [];
      if(cod === undefined || cod === null || cod === "") return; // fila sin artículo generado

      // Códigos numéricos cortos (p.ej. 0 cuando el Excel aún no tiene código
      // asignado para esa combinación) se muestran con el mismo formato de
      // 6 dígitos que el resto de códigos, en vez de descartarse.
      const codKey = typeof cod === "number" ? String(cod).padStart(6, "0") : String(cod);
      const esPendiente = codKey.toLowerCase().includes("pendiente") || codKey.toLowerCase().includes("crear") || codKey.toLowerCase() === "xxxx";
      // Si el código es un placeholder ("pendiente", "Crear código"...), varios
      // artículos DISTINTOS pueden compartirlo — agrupamos entonces por
      // código+descripción para no fusionar artículos diferentes entre sí.
      const groupKey = esPendiente ? `${codKey}|${desc}` : codKey;

      const target = partidasResult[idx];
      if(!target.lineas[groupKey]){
        target.lineas[groupKey] = {
          codigo: codKey,
          descripcion: desc || "",
          cantidad: 0,
          precio: Number(precio) || 0,
          dto: dtoDefault,
          pendiente: esPendiente,
          explicaciones: []
        };
      }
      target.lineas[groupKey].cantidad += Number(cant) || 0;
      if(EXPLICACIONES[row]){
        // La fórmula de cantidad está en la columna G, que es la 3ª del rango E:I (índice 2)
        const gFormula = (formulas && formulas[i] && formulas[i][2]) || "";
        try{ target.lineas[groupKey].explicaciones.push(EXPLICACIONES[row](answers, gFormula)); }catch(e){ /* si falta algún dato, se omite esa explicación */ }
      }
    });
    target_total(partidasResult[idx]);
  });

  function target_total(p){
    p.lineasArr = Object.values(p.lineas).map(l => ({ ...l, importe: l.cantidad * l.precio * (1 - l.dto / 100) }));
    p.total = p.lineasArr.reduce((s, l) => s + l.importe, 0);
  }

  const granTotal = partidasResult.reduce((s, p) => s + p.total, 0);
  return { partidas: partidasResult, granTotal, fecha: new Date(), referencia: readFormValues()["D3"] || "" };
}

/* =========================================================================
   RENDER DEL PRESUPUESTO (editable: cantidades se pueden ajustar a mano)
   ========================================================================= */
function escAttr(str){
  return String(str).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function fmt(n){
  n = Number(n) || 0;
  const negativo = n < 0;
  n = Math.abs(n);
  const [enteros, decimales] = n.toFixed(2).split(".");
  const enterosConPuntos = enteros.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (negativo ? "-" : "") + enterosConPuntos + "," + decimales;
}

// Convierte un texto en formato español (punto de miles, coma decimal) a número.
// Admite también que el usuario escriba con punto decimal por costumbre.
function parseEsNumber(str){
  if(typeof str !== "string") return Number(str) || 0;
  const limpio = str.trim().replace(/\./g, "").replace(",", ".");
  const n = parseFloat(limpio);
  return isNaN(n) ? 0 : n;
}

        <th>Cód. artículo</th><th>Descripción</th>
        <th class="num">Cantidad</th><th class="num">Precio</th><th class="num">Dto (%)</th><th class="num">Importe</th>
      </tr></thead><tbody>`;
    p.lineasArr.forEach((l, lIdx) => {
      const explicacion = (l.explicaciones && l.explicaciones.length)
        ? Array.from(new Set(l.explicaciones)).join(" + ")
        : "";
      const infoIcon = explicacion
        ? `<span class="info-icon" title="${escAttr(explicacion)}" onclick="alert('${escAttr(explicacion).replace(/'/g,"\\'")}')">ⓘ</span>`
        : "";

        <td>${l.codigo} ${infoIcon} ${l.pendiente ? '<div class="pendiente">código pendiente</div>' : ''}</td>
        <td>${l.descripcion}</td>
        <td class="num"><input type="text" inputmode="decimal" value="${fmt(l.cantidad)}"

             onchange="updateLinea(${pIdx},${lIdx},'precio',this.value)"> €</td>

    html += `</tbody></table></div>`;
  });

  html += `<div class="grand-total">TOTAL PRESUPUESTO: ${fmt(budget.granTotal)} €</div>`;
  content.innerHTML = html;
}

function updateLinea(pIdx, lIdx, campo, nuevoValor){
  const l = lastBudget.partidas[pIdx].lineasArr[lIdx];
  l[campo] = (campo === "cantidad" || campo === "precio") ? parseEsNumber(nuevoValor) : (Number(nuevoValor) || 0);
  l.importe = l.cantidad * l.precio * (1 - (l.dto || 0) / 100);
  lastBudget.partidas[pIdx].total = lastBudget.partidas[pIdx].lineasArr.reduce((s, x) => s + x.importe, 0);
  lastBudget.granTotal = lastBudget.partidas.reduce((s, p) => s + p.total, 0);
  renderBudget(lastBudget);
}

/* =========================================================================
   ARTÍCULOS ADICIONALES (buscados en la tarifa desde el formulario, antes
   de calcular). Se guardan en manualArticles y se incorporan al presupuesto
   al calcular/recalcular.
   ========================================================================= */
let manualArticles = []; // {codigo, descripcion, precio, cantidad, partidaIdx}

function renderArticleSearchResults(query){
  const results = document.getElementById("articleSearchResults");
  const q = (query || "").trim().toLowerCase();
  if(q.length < 2){
    results.innerHTML = `<p class="hint">Escribe al menos 2 caracteres…</p>`;
    return;
  }
  const matches = TARIFA_CATALOG.filter(a =>
    a.codigo.toLowerCase().includes(q) || a.descripcion.toLowerCase().includes(q) || a.tipo.toLowerCase().includes(q)
  ).slice(0, 15);

  if(matches.length === 0){
    results.innerHTML = `<p class="hint">Sin resultados.</p>`;
    return;
  }

  window._articleMatches = matches;
  results.innerHTML = matches.map((a, idx) => `
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--gris-borde);">
      <div style="flex:1;min-width:180px;"><strong>${a.codigo}</strong> — ${a.descripcion} <span class="hint">(${a.tipo ? a.tipo + " · " : ""}${a.precio.toFixed(2)} €)</span></div>
      <input type="number" id="qty_${idx}" value="1" min="0.01" step="any" style="width:70px;padding:6px;border:1px solid var(--gris-borde);border-radius:4px;" title="Cantidad">
      <select id="partida_${idx}" style="padding:6px;border:1px solid var(--gris-borde);border-radius:4px;max-width:220px;">
        ${PARTIDAS.map((p, i) => `<option value="${i}">${p.titulo}</option>`).join("")}
      </select>
      <button class="secondary" style="padding:6px 12px;font-size:12px;" onclick="addManualArticle(${idx})">Añadir</button>
    </div>`).join("");
}

function addManualArticle(idx){
  const articulo = window._articleMatches[idx];
  if(!articulo) return;
  const cantidad = Number(document.getElementById(`qty_${idx}`).value);
  const partidaIdx = Number(document.getElementById(`partida_${idx}`).value);
  if(isNaN(cantidad) || cantidad <= 0){
    alert("Cantidad no válida.");
    return;
  }
  manualArticles.push({ codigo: articulo.codigo, descripcion: articulo.descripcion, precio: articulo.precio, cantidad, partidaIdx });

  document.getElementById("articleSearchInput").value = "";
  document.getElementById("articleSearchResults").innerHTML = "";
  renderManualArticlesList();
  showToast(`"${articulo.descripcion}" añadido a la lista (${PARTIDAS[partidaIdx].titulo})`);
}

function removeManualArticle(idx){
  manualArticles.splice(idx, 1);
  renderManualArticlesList();
}

function renderManualArticlesList(){
  const el = document.getElementById("manualArticlesList");
  if(!el) return;
  if(manualArticles.length === 0){
    el.innerHTML = "";
    return;
  }
  el.innerHTML = `<p class="hint" style="margin-bottom:6px;">Artículos que se añadirán al calcular el presupuesto:</p>` +
    manualArticles.map((a, idx) => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--gris-borde);font-size:13px;">
        <div>${a.codigo} — ${a.descripcion} · ${a.cantidad} uds · ${PARTIDAS[a.partidaIdx].titulo}</div>
        <button class="secondary" style="padding:4px 10px;font-size:11px;" onclick="removeManualArticle(${idx})">Quitar</button>
      </div>`).join("");
}

// Incorpora los artículos de manualArticles al presupuesto ya calculado
function aplicarArticulosManuales(budget, dtoDefault){
  manualArticles.forEach(a => {
    budget.partidas[a.partidaIdx].lineasArr.push({
      codigo: a.codigo,
      descripcion: a.descripcion,
      cantidad: a.cantidad,
      precio: a.precio,
      dto: dtoDefault,
      importe: a.cantidad * a.precio * (1 - dtoDefault / 100),
      pendiente: false,
      manual: true,
      explicaciones: ["Artículo añadido manualmente al presupuesto."]
    });
  });
  budget.partidas.forEach(p => {
    p.total = p.lineasArr.reduce((s, x) => s + x.importe, 0);
  });
  budget.granTotal = budget.partidas.reduce((s, p) => s + p.total, 0);
}

/* =========================================================================
   EXPORTAR A PDF (html2canvas + jsPDF, todo en el navegador)
   Recorta el canvas en páginas reales de A4 (en vez de reposicionar la
   misma imagen completa), para que ninguna fila quede cortada a medias.
   ========================================================================= */
async function generarPDF(){
  const original = document.getElementById("budgetContent");

  // Clonamos el contenido en un contenedor oculto con ancho fijo "de escritorio"
  // (880px), para que el PDF salga siempre igual se pulse desde el móvil o el PC,
  // sin depender del ancho real de la pantalla ni de scrolls horizontales.
  const clone = original.cloneNode(true);
  const wrapper = document.createElement("div");
  wrapper.style.cssText = "position:fixed;top:0;left:-99999px;width:880px;background:#ffffff;padding:20px;";
  // Las tablas clonadas no deben heredar el scroll horizontal del móvil
  clone.querySelectorAll('div[style*="overflow-x"]').forEach(d => d.style.overflowX = "visible");
  // En el PDF los campos editables se muestran como texto plano, no como formulario
  clone.querySelectorAll('input[type="number"], input[type="text"]').forEach(inp => {
    const span = document.createElement("span");
    const valor = inp.type === "text" ? parseEsNumber(String(inp.value)) : (Number(inp.value) || 0);
    span.textContent = fmt(valor);
    inp.replaceWith(span);
  });
  wrapper.appendChild(clone);
  document.body.appendChild(wrapper);

  let canvas;
  try{
    canvas = await html2canvas(wrapper, { scale: 2, backgroundColor: "#ffffff", windowWidth: 920 });
  }finally{
    document.body.removeChild(wrapper);
  }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p", "mm", "a4");
  const marginMm = 10;
  const pageWidthMm = pdf.internal.pageSize.getWidth() - marginMm * 2;
  const pageHeightMm = pdf.internal.pageSize.getHeight() - marginMm * 2;

  // Relación px -> mm según el ancho de la imagen renderizada
  const pxPerMm = canvas.width / pageWidthMm;
  const pageHeightPx = Math.floor(pageHeightMm * pxPerMm);

  let renderedPx = 0, first = true;
  while(renderedPx < canvas.height){
    const sliceHeightPx = Math.min(pageHeightPx, canvas.height - renderedPx);

    const pageCanvas = document.createElement("canvas");
    pageCanvas.width = canvas.width;
    pageCanvas.height = sliceHeightPx;
    const ctx = pageCanvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
    ctx.drawImage(canvas, 0, renderedPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);

    const imgData = pageCanvas.toDataURL("image/png");
    const imgHeightMm = sliceHeightPx / pxPerMm;

    if(!first) pdf.addPage();
    pdf.addImage(imgData, "PNG", marginMm, marginMm, pageWidthMm, imgHeightMm);

    renderedPx += sliceHeightPx;
    first = false;
  }

  const nombre = `Presupuesto SATE - ${(lastBudget.referencia || "sin referencia")} - ${formatFecha(lastBudget.fecha)}.pdf`;
  return { pdf, nombre };
}

async function exportarPDF(){
  const { pdf, nombre } = await generarPDF();
  pdf.save(nombre);
}

function formatFecha(d){
  return d.toISOString().slice(0,10);
}

/* =========================================================================
   GUARDAR EN SHAREPOINT (carpeta del usuario / SATE)
   ========================================================================= */
async function guardarEnSharePoint(){
  const status = document.getElementById("budgetStatus");
  status.innerHTML = `<div class="spinner"></div><p>Guardando en SharePoint…</p>`;
  try{
    const email = account.username; // el correo tal cual, como nombre de carpeta
    await ensureFolderPath(`/${email}/${CONFIG.userSubfolder}`);

    const baseName = `Presupuesto SATE - ${(lastBudget.referencia || "sin referencia")} - ${formatFecha(lastBudget.fecha)}`;
    const dataPayload = {
      referencia: lastBudget.referencia,
      fecha: lastBudget.fecha,
      respuestas: readFormValues(),
      budget: lastBudget
    };
    const jsonBlob = new Blob([JSON.stringify(dataPayload)], { type: "application/json" });
    const jsonPath = `/${email}/${CONFIG.userSubfolder}/${baseName}.json`;
    await uploadFile(jsonPath, jsonBlob, "application/json");

    status.innerHTML = "";
    showToast(`Presupuesto guardado en Documentos/${email}/${CONFIG.userSubfolder}/ ✔`);
  }catch(err){
    status.innerHTML = `<div class="error-box">No se ha podido guardar en SharePoint.<br>${err.message}</div>`;
  }
}

async function uploadFile(path, blob, contentType){
  const res = await fetch(
    `https://graph.microsoft.com/v1.0/drives/${docsLibraryId}/root:${encodeURI(path)}:/content`,
    {
      method: "PUT",
      headers: { "Authorization": `Bearer ${graphToken}`, "Content-Type": contentType },
      body: blob
    }
  );
  if(!res.ok){
    const body = await res.text();
    throw new Error(`Graph error ${res.status}: ${body}`);
  }
}

// Crea, si no existen, cada carpeta del path indicado (ej: "/email/SATE")
// dentro de la biblioteca de documentos.
async function ensureFolderPath(path){
  const parts = path.split("/").filter(Boolean);
  let currentPath = "";
  for(const part of parts){
    const parentPath = currentPath;
    currentPath += "/" + part;
    const exists = await fetch(
      `https://graph.microsoft.com/v1.0/drives/${docsLibraryId}/root:${encodeURI(currentPath)}`,
      { headers: { "Authorization": `Bearer ${graphToken}` } }
    );
    if(exists.status === 404){
      const createUrl = parentPath === ""
        ? `https://graph.microsoft.com/v1.0/drives/${docsLibraryId}/root/children`
        : `https://graph.microsoft.com/v1.0/drives/${docsLibraryId}/root:${encodeURI(parentPath)}:/children`;
      await graphFetch(createUrl, {
        method: "POST",
        body: JSON.stringify({ name: part, folder: {}, "@microsoft.graph.conflictBehavior": "rename" })
      });
    }
  }
}

function showToast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

/* =========================================================================
   MENÚ PRINCIPAL / ABRIR PRESUPUESTOS GUARDADOS
   ========================================================================= */
function goToNewBudget(){
  document.getElementById("menuScreen").style.display = "none";
  document.getElementById("openScreen").style.display = "none";
  document.getElementById("workTabs").style.display = "flex";
  // Formulario en blanco
  document.querySelectorAll("#questionsForm input, #questionsForm select").forEach(el => el.value = "");
  document.getElementById("tabBudgetBtn").disabled = true;
  document.getElementById("budgetContent").innerHTML = "";
  lastBudget = null;
  manualArticles = [];
  renderManualArticlesList();
  showTab("form");
}

function backToMenu(){
  document.getElementById("workTabs").style.display = "none";
  document.getElementById("openScreen").style.display = "none";
  document.getElementById("tabForm").style.display = "none";
  document.getElementById("tabBudget").style.display = "none";
  document.getElementById("menuScreen").style.display = "block";
}

async function goToOpenBudget(){
  document.getElementById("menuScreen").style.display = "none";
  document.getElementById("openScreen").style.display = "block";
  const list = document.getElementById("openList");
  list.innerHTML = `<div class="spinner"></div><p>Cargando presupuestos guardados…</p>`;
  try{
    const email = account.username;
    const folderPath = `/${email}/${CONFIG.userSubfolder}`;
    const res = await graphFetch(
      `https://graph.microsoft.com/v1.0/drives/${docsLibraryId}/root:${encodeURI(folderPath)}:/children`
    ).catch(() => ({ value: [] })); // si la carpeta aún no existe, no hay nada guardado

    const jsonFiles = (res.value || []).filter(f => f.name.toLowerCase().endsWith(".json"))
      .sort((a,b) => new Date(b.lastModifiedDateTime) - new Date(a.lastModifiedDateTime));

    if(jsonFiles.length === 0){
      list.innerHTML = `<p style="color:#888;">Todavía no tienes presupuestos guardados.</p>`;
      return;
    }

    list.innerHTML = "";
    jsonFiles.forEach(f => {
      const item = document.createElement("div");
      item.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--gris-borde);border-radius:8px;margin-bottom:8px;cursor:pointer;";
      const fecha = new Date(f.lastModifiedDateTime).toLocaleString("es-ES");
      item.innerHTML = `<div><strong>${f.name.replace(/\.json$/i,"")}</strong><div class="hint">Guardado: ${fecha}</div></div><div>Abrir →</div>`;
      item.onclick = () => abrirPresupuestoGuardado(f.id);
      list.appendChild(item);
    });
  }catch(err){
    list.innerHTML = `<div class="error-box">No se han podido listar los presupuestos guardados.<br>${err.message}</div>`;
  }
}

async function abrirPresupuestoGuardado(fileId){
  const list = document.getElementById("openList");
  list.innerHTML = `<div class="spinner"></div><p>Abriendo presupuesto…</p>`;
  try{
    const res = await fetch(
      `https://graph.microsoft.com/v1.0/drives/${docsLibraryId}/items/${fileId}/content`,
      { headers: { "Authorization": `Bearer ${graphToken}` } }
    );
    if(!res.ok) throw new Error(`Graph error ${res.status}`);
    const data = await res.json();

    document.getElementById("openScreen").style.display = "none";
    document.getElementById("workTabs").style.display = "flex";

    // Repoblar el formulario con las respuestas guardadas
    Object.entries(data.respuestas || {}).forEach(([cell, val]) => {
      const el = document.getElementById(cell);
      if(el) el.value = val;
    });

    // Mostrar directamente el presupuesto guardado (puede recalcularse si se quiere)
    lastBudget = data.budget;
    lastBudget.fecha = new Date(lastBudget.fecha);
    document.getElementById("tabBudgetBtn").disabled = false;
    renderBudget(lastBudget);
    showTab("budget");
  }catch(err){
    list.innerHTML = `<div class="error-box">No se ha podido abrir el presupuesto.<br>${err.message}</div>`;
  }
}

/* =========================================================================
   NAVEGACIÓN DE PESTAÑAS
   ========================================================================= */
function showTab(tab){
  document.getElementById("tabForm").style.display = tab === "form" ? "block" : "none";
  document.getElementById("tabBudget").style.display = tab === "budget" ? "block" : "none";
  document.getElementById("tabFormBtn").classList.toggle("active", tab === "form");
  document.getElementById("tabBudgetBtn").classList.toggle("active", tab === "budget");
}

/* =========================================================================
   ARRANQUE
   ========================================================================= */
window.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("versionTag").textContent = APP_VERSION;
  if(typeof msal === "undefined"){
    document.getElementById("loginBox").innerHTML = `
      <div class="error-box">No se ha podido cargar la librería de login (MSAL).<br>
      Puede que el navegador o la red esté bloqueando el CDN. Prueba a desactivar
      la "Tracking Prevention" de Edge para esta página, o revisa la consola (F12) para más detalle.</div>`;
    return;
  }
  initMsal();
  document.getElementById("loginBtn").onclick = login;
  document.getElementById("menuNewBtn").onclick = goToNewBudget;
  document.getElementById("menuOpenBtn").onclick = goToOpenBudget;
  document.getElementById("calcBtn").onclick = (e) => { e.preventDefault(); calcularPresupuesto(); };
  document.getElementById("recalcBtn").onclick = calcularPresupuesto;
  document.getElementById("pdfBtn").onclick = exportarPDF;
  document.getElementById("saveBtn").onclick = guardarEnSharePoint;

  // Al volver de Microsoft tras loginRedirect, el resultado llega aquí
  let redirectResult;
  try{
    redirectResult = await msalInstance.handleRedirectPromise();
  }catch(err){
    showLoginError(err);
    return;
  }

  if(redirectResult && redirectResult.account){
    account = redirectResult.account;
    msalInstance.setActiveAccount(account);
    await afterLogin();
    return;
  }

  const accounts = msalInstance.getAllAccounts();
  if(accounts.length > 0){
    account = accounts[0];
    msalInstance.setActiveAccount(account);
    await afterLogin();
  }
});
</script>
